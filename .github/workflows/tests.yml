name: tests

on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install -r gateway/requirements.txt PyYAML
      - name: Run unit tests
        run: |
          python -m unittest discover -s gateway/tests -v
          python -m unittest discover -s ui_worker/tests -v
          python -m unittest discover -s panel/tests -v
